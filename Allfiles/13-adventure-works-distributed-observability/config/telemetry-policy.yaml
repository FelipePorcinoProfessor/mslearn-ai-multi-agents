policy_id: adventure-works-agent-telemetry
version: 1.0.0
service_name: adventure-works-agent-lab
retention_days: 30
sampling:
  local: always_on
  lab_export_ratio: 1.0
  production_head_ratio: 0.05
privacy:
  hash_session_ids: true
  prohibited_fields:
    - raw_customer_id
    - email
    - payment_card
    - raw_prompt
    - chain_of_thought
alerts:
  latency_threshold_ms: 60
  error_rate_threshold: 0.05
  token_anomaly_sigma: 3.0