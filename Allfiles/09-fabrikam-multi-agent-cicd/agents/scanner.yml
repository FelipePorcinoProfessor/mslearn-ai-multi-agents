name: scanner
version: 1.2.0
depends_on: {}
model:
  name: gpt-5.4-mini
  version: '2026-03-17'
hosted:
  kind: hosted
  protocol: responses
  protocol_version: 2.0.0
  runtime: python_3_13
  entry_point: src/scanner_agent.py
evaluation:
  dataset: fabrikam-release-smoke
  dataset_version: '1'
  evaluator: deterministic-contract-smoke
  evaluator_version: '1'
instructions: |
  Review the supplied code change for security vulnerabilities.
  Return concise findings with severity, file, line, and remediation fields.
  Do not report style-only concerns.
tools:
  scan_code:
    input:
      required: [repository, commit]
      types:
        repository: string
        commit: string
    output:
      required: [findings, schema_version]
      types:
        findings: array
        schema_version: string